<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GRAVITAS // 三维宇宙引力场</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
/* ==========================================================================
   GRAVITAS // Minimalist Cosmic Observatory Design System
   Monochrome Black/White Polarity + Organic Breathing Tactility
   ========================================================================== */

:root {
  --font-display: "Space Grotesk", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;

  --ease-expo: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-breath: cubic-bezier(0.37, 0, 0.63, 1);

  --theme-duration: 620ms;
}

/* Dark Theme: Obsidian Void */
[data-theme="dark"] {
  --bg-void: #050507;
  --bg-surface: rgba(12, 13, 18, 0.56);
  --bg-surface-elevated: rgba(20, 22, 30, 0.76);
  --surface-solid: #0b0c10;

  --fg-primary: #f4f4f7;
  --fg-secondary: rgba(244, 244, 247, 0.62);
  --fg-muted: rgba(244, 244, 247, 0.38);

  --border-hairline: rgba(255, 255, 255, 0.11);
  --border-strong: rgba(255, 255, 255, 0.28);
  --border-breath: rgba(255, 255, 255, 0.34);

  --btn-bg: rgba(255, 255, 255, 0.045);
  --btn-bg-hover: rgba(255, 255, 255, 0.105);
  --btn-primary-bg: rgba(255, 255, 255, 0.12);
  --btn-primary-border: rgba(255, 255, 255, 0.32);

  --slider-pill-bg: rgba(255, 255, 255, 0.14);
  --slider-pill-border: rgba(255, 255, 255, 0.28);

  --breath-glow: rgba(255, 255, 255, 0.14);
  --breath-glow-strong: rgba(255, 255, 255, 0.26);
  --spot-sheen: rgba(255, 255, 255, 0.16);
  --ripple-color: rgba(255, 255, 255, 0.35);

  --vignette-edge: rgba(2, 2, 4, 0.72);
  --shadow-dock: 0 20px 56px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.07);
}

/* Light Theme: Alabaster Observatory */
[data-theme="light"] {
  --bg-void: #f3f2ee;
  --bg-surface: rgba(247, 246, 242, 0.66);
  --bg-surface-elevated: rgba(255, 255, 255, 0.88);
  --surface-solid: #efeeea;

  --fg-primary: #0b0c10;
  --fg-secondary: rgba(11, 12, 16, 0.62);
  --fg-muted: rgba(11, 12, 16, 0.42);

  --border-hairline: rgba(11, 12, 16, 0.11);
  --border-strong: rgba(11, 12, 16, 0.28);
  --border-breath: rgba(11, 12, 16, 0.32);

  --btn-bg: rgba(11, 12, 16, 0.04);
  --btn-bg-hover: rgba(11, 12, 16, 0.09);
  --btn-primary-bg: rgba(11, 12, 16, 0.085);
  --btn-primary-border: rgba(11, 12, 16, 0.3);

  --slider-pill-bg: rgba(11, 12, 16, 0.1);
  --slider-pill-border: rgba(11, 12, 16, 0.26);

  --breath-glow: rgba(11, 12, 16, 0.08);
  --breath-glow-strong: rgba(11, 12, 16, 0.16);
  --spot-sheen: rgba(11, 12, 16, 0.09);
  --ripple-color: rgba(11, 12, 16, 0.24);

  --vignette-edge: rgba(224, 222, 215, 0.52);
  --shadow-dock: 0 18px 48px rgba(15, 16, 22, 0.09), inset 0 1px 0 rgba(255, 255, 255, 0.75);
}

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--bg-void);
  color: var(--fg-primary);
  font-family: var(--font-display);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
  transition:
    background-color var(--theme-duration) var(--ease-expo),
    color var(--theme-duration) var(--ease-expo);
}

/* Fullscreen 3D Canvas */
#cosmos-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
  z-index: 1;
}

#cosmos-canvas:active,
body.is-dragging #cosmos-canvas {
  cursor: grabbing;
}

/* Soft Atmospheric Vignette */
.vignette-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  background: radial-gradient(
    circle at 50% 48%,
    transparent 42%,
    var(--vignette-edge) 100%
  );
  transition: background var(--theme-duration) var(--ease-expo);
}

/* HUD Shell */
.hud-shell {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  padding: clamp(18px, 2.8vw, 34px) clamp(20px, 3.4vw, 44px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: opacity 420ms var(--ease-expo), transform 420ms var(--ease-expo);
}

body.is-zen .hud-shell {
  opacity: 0;
  transform: scale(0.985);
  pointer-events: none;
}

/* ==========================================================================
   Top Navigation Bar
   ========================================================================== */
.hud-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand-lockup {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 8px 14px 8px 11px;
  border-radius: 999px;
  background: var(--bg-surface);
  border: 1px solid var(--border-hairline);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: var(--shadow-dock);
  transition:
    background-color var(--theme-duration) var(--ease-expo),
    border-color var(--theme-duration) var(--ease-expo);
}

.brand-emblem {
  display: grid;
  place-items: center;
  color: var(--fg-primary);
  animation: slow-spin 26s linear infinite;
}

.brand-text {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  font-size: 13px;
  letter-spacing: 0.22em;
  font-weight: 500;
}

.brand-divider,
.brand-index {
  color: var(--fg-muted);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding-left: 10px;
  margin-left: 2px;
  border-left: 1px solid var(--border-hairline);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--fg-secondary);
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--fg-primary);
  animation: dot-breathe 3.4s var(--ease-breath) infinite;
}

.top-actions {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

/* ==========================================================================
   Editorial Overlay (3D Pointer-Parallax Typography)
   ========================================================================== */
.editorial-overlay {
  position: fixed;
  left: clamp(24px, 3.6vw, 48px);
  top: clamp(92px, 12vh, 132px);
  max-width: 340px;
  pointer-events: none;
  transform: translate3d(var(--ui-parallax-x, 0px), var(--ui-parallax-y, 0px), 0);
  transition: transform 220ms ease-out;
}

.editorial-eyebrow {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  color: var(--fg-muted);
  margin-bottom: 8px;
}

.editorial-title {
  font-size: clamp(28px, 3.8vw, 46px);
  font-weight: 300;
  letter-spacing: 0.24em;
  line-height: 1.04;
  color: var(--fg-primary);
  margin-bottom: 10px;
}

.editorial-subtitle {
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 0.08em;
  color: var(--fg-secondary);
  line-height: 1.6;
  margin-bottom: 14px;
}

.editorial-coords {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--fg-muted);
  font-variant-numeric: tabular-nums;
}

.editorial-coords b {
  font-weight: 500;
  color: var(--fg-secondary);
}

.coord-dot {
  width: 2.5px;
  height: 2.5px;
  border-radius: 50%;
  background: var(--fg-muted);
}

/* ==========================================================================
   Bottom Control Dock
   ========================================================================== */
.control-dock {
  pointer-events: auto;
  align-self: center;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 10px;
  border-radius: 999px;
  background: var(--bg-surface);
  border: 1px solid var(--border-hairline);
  backdrop-filter: blur(22px) saturate(120%);
  -webkit-backdrop-filter: blur(22px) saturate(120%);
  box-shadow: var(--shadow-dock);
  transition:
    background-color var(--theme-duration) var(--ease-expo),
    border-color var(--theme-duration) var(--ease-expo),
    box-shadow var(--theme-duration) var(--ease-expo);
}

.dock-sep {
  width: 1px;
  height: 22px;
  background: var(--border-hairline);
  flex-shrink: 0;
  transition: background-color var(--theme-duration) var(--ease-expo);
}

/* Segmented Gravity Mode Switch */
.mode-switch {
  position: relative;
  display: inline-flex;
  align-items: center;
  padding: 3px;
  border-radius: 999px;
  background: var(--btn-bg);
  border: 1px solid var(--border-hairline);
}

.mode-slider {
  position: absolute;
  top: 3px;
  left: 3px;
  height: calc(100% - 6px);
  width: 66px;
  border-radius: 999px;
  background: var(--slider-pill-bg);
  border: 1px solid var(--slider-pill-border);
  pointer-events: none;
  transition:
    transform 420ms var(--ease-spring),
    width 420ms var(--ease-spring),
    background-color var(--theme-duration) var(--ease-expo),
    border-color var(--theme-duration) var(--ease-expo);
  animation: pill-breathe 3.8s var(--ease-breath) infinite;
}

.mode-btn {
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 32px;
  padding: 0 13px;
  border: none;
  border-radius: 999px;
  background: transparent;
  color: var(--fg-secondary);
  font-family: var(--font-display);
  font-size: 12.5px;
  font-weight: 400;
  letter-spacing: 0.08em;
  cursor: pointer;
  outline: none;
  transition: color 240ms var(--ease-expo), transform 180ms var(--ease-spring);
}

.mode-btn:hover {
  color: var(--fg-primary);
}

.mode-btn:active {
  transform: scale(0.94);
}

.mode-btn.is-active {
  color: var(--fg-primary);
  font-weight: 500;
}

.mode-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.35;
  transition: opacity 280ms var(--ease-expo), transform 280ms var(--ease-spring);
}

.mode-btn.is-active .mode-dot {
  opacity: 1;
  transform: scale(1.25);
}

/* Gravity Strength Slider */
.strength-control {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 0 6px;
}

.strength-label {
  font-size: 11.5px;
  letter-spacing: 0.08em;
  color: var(--fg-secondary);
}

.slider-track-wrap {
  display: flex;
  align-items: center;
  width: 78px;
}

#gravity-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 2px;
  border-radius: 999px;
  background: var(--border-strong);
  outline: none;
  cursor: pointer;
}

#gravity-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--fg-primary);
  border: 2px solid var(--surface-solid);
  box-shadow: 0 0 0 1px var(--border-strong), 0 0 12px var(--breath-glow-strong);
  cursor: pointer;
  transition: transform 200ms var(--ease-spring), box-shadow 240ms ease;
  animation: thumb-breathe 3.8s var(--ease-breath) infinite;
}

#gravity-slider::-webkit-slider-thumb:hover {
  transform: scale(1.22);
  box-shadow: 0 0 0 1px var(--fg-primary), 0 0 18px var(--breath-glow-strong);
}

#gravity-slider::-moz-range-thumb {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--fg-primary);
  border: 2px solid var(--surface-solid);
  box-shadow: 0 0 0 1px var(--border-strong);
  cursor: pointer;
}

.strength-value {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--fg-primary);
  min-width: 34px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.dock-actions {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

/* ==========================================================================
   Breathing Tactile Buttons (Core Aesthetic Signature)
   ========================================================================== */
.breath-btn {
  position: relative;
  overflow: visible;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 36px;
  padding: 0 14px;
  white-space: nowrap;
  flex-shrink: 0;
  border-radius: 999px;
  background: var(--btn-bg);
  border: 1px solid var(--border-hairline);
  color: var(--fg-primary);
  font-family: var(--font-display);
  font-size: 12.5px;
  font-weight: 400;
  letter-spacing: 0.08em;
  cursor: pointer;
  outline: none;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  transform: translate3d(calc(var(--mx, 0) * 3px), calc(var(--my, 0) * 2.4px), 0) scale(1);
  transition:
    transform 240ms var(--ease-spring),
    background-color 260ms var(--ease-expo),
    border-color 280ms var(--ease-expo),
    color var(--theme-duration) var(--ease-expo),
    box-shadow 300ms var(--ease-expo);
  animation: btn-breathe-idle 4.4s var(--ease-breath) infinite;
}

/* Staggered respiration phases so dock buttons feel alive together */
.breath-btn:nth-child(2n) {
  animation-delay: -1.4s;
}
.breath-btn:nth-child(3n) {
  animation-delay: -2.7s;
}

/* Outer soft breathing aura */
.breath-btn::before {
  content: "";
  position: absolute;
  inset: -4px;
  border-radius: inherit;
  pointer-events: none;
  opacity: 0.55;
  background: radial-gradient(
    circle at var(--spot-x, 50%) var(--spot-y, 50%),
    var(--breath-glow),
    transparent 72%
  );
  filter: blur(6px);
  transition: opacity 280ms ease, transform 320ms var(--ease-expo);
  animation: aura-breathe 4.4s var(--ease-breath) infinite;
}

/* Internal radial cursor sheen clipped cleanly via mask/overflow inner layer */
.breath-btn::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(
    64px circle at var(--spot-x, 50%) var(--spot-y, 50%),
    var(--spot-sheen),
    transparent 75%
  );
  transition: opacity 240ms ease;
}

.breath-btn:hover {
  background: var(--btn-bg-hover);
  border-color: var(--border-strong);
  transform: translate3d(calc(var(--mx, 0) * 3.5px), calc(var(--my, 0) * 2.8px - 1.5px), 0) scale(1.032);
  box-shadow: 0 8px 24px -6px var(--breath-glow-strong);
  animation-play-state: paused;
}

.breath-btn:hover::before {
  opacity: 0.9;
  transform: scale(1.06);
}

.breath-btn:hover::after {
  opacity: 1;
}

.breath-btn:active {
  transform: translate3d(calc(var(--mx, 0) * 2px), calc(var(--my, 0) * 1.5px + 0.5px), 0) scale(0.95);
  transition-duration: 90ms;
}

.breath-btn:focus-visible,
.mode-btn:focus-visible {
  box-shadow: 0 0 0 2px var(--surface-solid), 0 0 0 3.5px var(--fg-primary);
}

/* Primary Breathing Action Button (Pulse & Theme Switch) */
.breath-btn--primary {
  background: var(--btn-primary-bg);
  border-color: var(--btn-primary-border);
  font-weight: 500;
  animation: btn-breathe-primary 3.5s var(--ease-breath) infinite;
}

.breath-btn--primary::before {
  inset: -6px;
  border: 1px solid var(--border-hairline);
  background: radial-gradient(circle, var(--breath-glow-strong) 0%, transparent 70%);
  animation: aura-ring-breathe 3.5s var(--ease-breath) infinite;
}

.breath-btn--theme {
  background: var(--bg-surface);
  border-color: var(--border-strong);
  padding: 0 15px 0 12px;
  box-shadow: var(--shadow-dock);
  animation: btn-breathe-primary 4.0s var(--ease-breath) infinite;
}

.breath-btn--compact {
  height: 36px;
  padding: 0 13px;
  background: var(--bg-surface);
  box-shadow: var(--shadow-dock);
}

.breath-btn--ghost {
  color: var(--fg-secondary);
}

.breath-btn--ghost:hover {
  color: var(--fg-primary);
}

.breath-btn[aria-pressed="true"]:not(#btn-theme) {
  background: var(--slider-pill-bg);
  border-color: var(--fg-primary);
}

.btn-icon {
  display: inline-grid;
  place-items: center;
  flex-shrink: 0;
}

.btn-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 999px;
  border: 1px solid var(--border-hairline);
  color: var(--fg-secondary);
  font-variant-numeric: tabular-nums;
}

/* Theme Eclipse SVG Morph */
.theme-glyph {
  display: inline-grid;
  place-items: center;
}

.theme-glyph .glyph-orbit {
  transform-origin: center;
  transition: transform 600ms var(--ease-expo);
}

.theme-glyph .glyph-core {
  transform-origin: center;
  transition: transform 520ms var(--ease-spring);
}

.theme-glyph .glyph-eclipse {
  fill: var(--surface-solid);
  transform-origin: center;
  transition:
    fill var(--theme-duration) var(--ease-expo),
    transform 520ms var(--ease-expo),
    opacity 420ms ease;
}

[data-theme="light"] .theme-glyph .glyph-orbit {
  transform: rotate(90deg) scale(1.06);
}

[data-theme="light"] .theme-glyph .glyph-core {
  transform: scale(0.88);
}

[data-theme="light"] .theme-glyph .glyph-eclipse {
  opacity: 0;
  transform: translate(4px, -4px) scale(0.15);
}

/* Ripple Exhale Element spawned on click */
.breath-ripple {
  position: absolute;
  border-radius: 999px;
  pointer-events: none;
  border: 1px solid var(--ripple-color);
  background: radial-gradient(circle, var(--breath-glow) 0%, transparent 70%);
  transform: translate(-50%, -50%) scale(0.15);
  opacity: 0.9;
  animation: breath-exhale 560ms var(--ease-expo) forwards;
}

/* ==========================================================================
   Bottom Corner Annotations
   ========================================================================== */
.corner-hints,
.corner-metrics {
  position: fixed;
  bottom: clamp(18px, 2.6vw, 30px);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  color: var(--fg-muted);
  pointer-events: none;
  font-variant-numeric: tabular-nums;
  transition: opacity 320ms ease, color var(--theme-duration) var(--ease-expo);
}

.corner-hints {
  left: clamp(20px, 3.4vw, 44px);
}

.corner-metrics {
  right: clamp(20px, 3.4vw, 44px);
}

.corner-metrics b {
  font-weight: 500;
  color: var(--fg-secondary);
}

.hint-sep {
  opacity: 0.45;
}

/* Zen Restore Floating Button */
.zen-restore {
  position: fixed;
  top: clamp(18px, 2.8vw, 34px);
  right: clamp(20px, 3.4vw, 44px);
  z-index: 20;
}

/* ==========================================================================
   Audio Source Popover & Reactive Field HUD
   ========================================================================== */
.audio-popover {
  position: fixed;
  top: clamp(68px, 6.2vw, 86px);
  right: clamp(20px, 3.4vw, 44px);
  z-index: 18;
  width: min(352px, calc(100vw - 32px));
  padding: 14px 16px 15px;
  border-radius: 20px;
  background: var(--bg-surface-elevated);
  border: 1px solid var(--border-hairline);
  box-shadow: var(--shadow-dock);
  backdrop-filter: blur(22px) saturate(135%);
  -webkit-backdrop-filter: blur(22px) saturate(135%);
  display: flex;
  flex-direction: column;
  gap: 12px;
  color: var(--fg-primary);
  pointer-events: auto;
  transform-origin: top right;
  transition:
    opacity 260ms var(--ease-expo),
    transform 260ms var(--ease-expo),
    background-color var(--theme-duration) var(--ease-expo),
    border-color var(--theme-duration) var(--ease-expo);
}

body.is-zen .audio-popover {
  opacity: 0;
  pointer-events: none;
  transform: translateY(-8px) scale(0.97);
}

.audio-popover-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.audio-popover-title {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;

.audio-src-name {

}

.audio-select option {

}

.audio-mini-btn {

  font-size: 11.5px;
  flex-shrink: 0;
}

.audio-mini-btn:disabled {

}

.audio-file-name {
  flex: 1;
  min-width: 0;

.audio-sens-row {

  flex-direction: column;
  gap: 6px;
}

.audio-sens-head {
  display: flex;
  align-items: center;

}

.audio-val {

  font-size: 11px;
  color: var(--fg-primary);
}

.audio-slider {

  width: 100%;
  height: 4px;
  border-radius: 999px;
  background: var(--border-hairline);
  outline: none;
  cursor: pointer;
}

.audio-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--fg-primary);
  border: 2px solid var(--surface-solid);
  box-shadow: 0 0 10px var(--breath-glow-strong);

.audio-slider::-webkit-slider-thumb:hover {

}

.audio-slider::-moz-range-thumb {

  height: 14px;

.audio-meter {

.audio-band {

.audio-band-track {

  border-radius: 999px;
  background: var(--border-hairline);

}

.audio-band-fill {

  width: 0%;
  border-radius: 999px;
  background: var(--fg-primary);

}

.audio-status {

}

body.audio-active #btn-audio {

}

[hidden] {
  display: none !important;
}

/* ==========================================================================
   Keyframe Choreography (Organic Respiration)
   ========================================================================== */
@keyframes btn-breathe-idle {
  0%, 100% {
    box-shadow: 0 0 0 0 transparent;
    border-color: var(--border-hairline);
  }
  50% {
    box-shadow: 0 0 16px -2px var(--breath-glow);
    border-color: var(--border-breath);
  }
}

@keyframes btn-breathe-primary {
  0%, 100% {
    transform: translate3d(calc(var(--mx, 0) * 3px), calc(var(--my, 0) * 2.4px), 0) scale(1);
    box-shadow: 0 0 0 0 transparent;
  }
  50% {
    transform: translate3d(calc(var(--mx, 0) * 3px), calc(var(--my, 0) * 2.4px), 0) scale(1.018);
    box-shadow: 0 0 24px 0 var(--breath-glow-strong);
  }
}

@keyframes aura-breathe {
  0%, 100% {
    opacity: 0.35;
    transform: scale(0.96);
  }
  50% {
    opacity: 0.78;
    transform: scale(1.04);
  }
}

@keyframes aura-ring-breathe {
  0%, 100% {
    opacity: 0.25;
    transform: scale(0.97);
  }
  50% {
    opacity: 0.75;
    transform: scale(1.06);
  }
}

@keyframes pill-breathe {
  0%, 100% {
    box-shadow: 0 0 0 0 transparent;
  }
  50% {
    box-shadow: 0 0 14px -1px var(--breath-glow);
  }
}

@keyframes thumb-breathe {
  0%, 100% {
    box-shadow: 0 0 0 1px var(--border-strong), 0 0 8px var(--breath-glow);
  }
  50% {
    box-shadow: 0 0 0 1px var(--fg-primary), 0 0 16px var(--breath-glow-strong);
  }
}

@keyframes dot-breathe {
  0%, 100% {
    opacity: 0.35;
    transform: scale(0.85);
  }
  50% {
    opacity: 1;
    transform: scale(1.22);
  }
}

@keyframes breath-exhale {
  0% {
    width: 12px;
    height: 12px;
    opacity: 0.85;
  }
  100% {
    width: 118px;
    height: 118px;
    opacity: 0;
  }
}

@keyframes slow-spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

/* ==========================================================================
   Responsive Breakpoints
   ========================================================================== */
@media (max-width: 1360px) {
  .corner-hints,
  .corner-metrics {
    display: none;
  }
}

@media (max-width: 780px) {
  .hud-top {
    gap: 8px;
  }

  .brand-lockup {
    padding: 7px 11px 7px 9px;
    gap: 8px;
  }

  .brand-text {
    font-size: 12px;
    letter-spacing: 0.16em;
  }

  .top-actions {
    gap: 6px;
  }

  .breath-btn--compact {
    padding: 0 10px;
    height: 34px;
  }

  .breath-btn--theme {
    padding: 0 11px 0 9px;
    height: 34px;
  }

  .editorial-overlay {
    top: 84px;
    max-width: 260px;
  }

  .editorial-title {
    font-size: 26px;
  }

  .editorial-coords,

    display: none;
  }

  .control-dock {
    flex-wrap: wrap;
    justify-content: center;
    border-radius: 24px;
    max-width: calc(100vw - 24px);
    gap: 8px;
    padding: 10px;
  }

  .dock-sep {

  }

  .top-actions .btn-label {
    font-size: 11.5px;
  }

  #btn-audio .btn-label,

  .audio-popover {
    top: 66px;
    left: 12px;
    right: 12px;
    width: auto;
    max-width: none;
    padding: 13px 14px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .breath-btn,

  .mode-slider,

  .brand-emblem,
  #gravity-slider::-webkit-slider-thumb {
    animation: none !important;
  }
}

      this.sinY = Math.sin(this.yaw);
      this.cosP = Math.cos(this.pitch);
      this.sinP = Math.sin(this.pitch);

        y: halfH - (y2 - this.parallaxY * 0.25) * scale,

          this.lastPointer.y = e.clientY;

          if (this.pointerMoveDist > 6) {
            this.isCompressing = false;
            this.holdCharge = 0;
            this.camera.userInteracting = true;
            document.body.classList.add('is-dragging');
            this.camera.orbit(-dx * 0.0054, dy * 0.0046);
          }
        }
      });

      const releasePointer = (e) => {
        if (!this.isPointerDown) return;
        const now = performance.now();
        if (this.isCompressing && this.holdCharge > 0.14) {
          this.triggerPulse(
            this.smoothCursorWorld.x,
            this.smoothCursorWorld.y,
            this.smoothCursorWorld.z,
            0.55 + this.holdCharge * 1.15
          );
          if (this.callbacks.onShockwave) {
            this.callbacks.onShockwave(this.holdCharge);
          }
        } else if (e && e.pointerType === 'touch' && this.pointerMoveDist < 12 && now - this.pointerDownTime < 280) {
          if (now - lastTouchTapTime < 340 && Math.hypot(e.clientX - lastTouchTapX, e.clientY - lastTouchTapY) < 36) {
            lastTouchTapTime = 0;
            lastWellSpawnMs = now;
            const worldPos = this.camera.screenToPlane(
              e.clientX,
              e.clientY,
              this.width * 0.5,
              this.height * 0.5
            );
            this.addWell(worldPos);
            if (this.callbacks.onWellSpawned) {
              this.callbacks.onWellSpawned();
            }
          } else {
            lastTouchTapTime = now;
            lastTouchTapX = e.clientX;
            lastTouchTapY = e.clientY;
          }
        }
        this.isPointerDown = false;
        this.isCompressing = false;
        this.camera.userInteracting = false;
        document.body.classList.remove('is-dragging');
        if (e && e.pointerId !== undefined && this.canvas.hasPointerCapture(e.pointerId)) {
          this.canvas.releasePointerCapture(e.pointerId);
        }
      };

      window.addEventListener('pointerup', releasePointer);
      window.addEventListener('pointercancel', releasePointer);

      this.canvas.addEventListener('pointerleave', () => {
        if (!this.isPointerDown) {
          this.pointerScreen.active = false;
        }
      });

      this.canvas.addEventListener(
        'wheel',
        (e) => {
          e.preventDefault();
          this.camera.zoom(e.deltaY * 0.48);
        },
        { passive: false }
      );

      this.canvas.addEventListener('dblclick', (e) => {
        if (performance.now() - lastWellSpawnMs < 350) return;
        const worldPos = this.camera.screenToPlane(
          e.clientX,
          e.clientY,
          this.width * 0.5,
          this.height * 0.5
        );
        this.addWell(worldPos);
        if (this.callbacks.onWellSpawned) {
          this.callbacks.onWellSpawned();
        }
      });
    }

    start() {
      if (this.running) return;
      this.running = true;
      this.lastFrameTime = performance.now();
      const tick = (now) => {
        if (!this.running) return;
        const dt = Math.min((now - this.lastFrameTime) / 1000, 0.035);
        this.lastFrameTime = now;
        this.update(dt, now);
        this.render();
        this.rafId = requestAnimationFrame(tick);
      };
      this.rafId = requestAnimationFrame(tick);
    }

    update(dt, now) {
      this.time += dt;

      // Smooth black/white transition
      const themeLerp = 1 - Math.exp(-5.8 * dt);
      this.themeT = lerp(this.themeT, this.themeTarget, themeLerp);

      // Smooth gravity mode transitions
      const targetSign = this.mode === 'attract' ? 1 : this.mode === 'repel' ? -1 : 0;
      this.effectiveModeSign = lerp(this.effectiveModeSign, targetSign, 1 - Math.exp(-4.5 * dt));

      // Update camera
      this.camera.update(dt, this.width, this.height);

      // Update cursor world projection & hold compression charge
      if (this.pointerScreen.active) {
        const projWorld = this.camera.screenToPlane(
          this.pointerScreen.x,
          this.pointerScreen.y,
          this.width * 0.5,
          this.height * 0.5
        );
        this.cursorWorld = projWorld;
        const follow = 1 - Math.exp(-14 * dt);
        this.smoothCursorWorld.x = lerp(this.smoothCursorWorld.x, projWorld.x, follow);
        this.smoothCursorWorld.y = lerp(this.smoothCursorWorld.y, projWorld.y, follow);
        this.smoothCursorWorld.z = lerp(this.smoothCursorWorld.z, projWorld.z, follow);
        this.cursorInfluence = lerp(this.cursorInfluence, 1, 1 - Math.exp(-8 * dt));
      } else {
        this.cursorInfluence = lerp(this.cursorInfluence, 0, 1 - Math.exp(-4 * dt));
      }

      if (this.isPointerDown && this.pointerMoveDist <= 6 && now - this.pointerDownTime > 170) {
        this.isCompressing = true;
        this.holdCharge = clamp(this.holdCharge + dt * 0.92, 0, 1);
      } else if (!this.isCompressing) {
        this.holdCharge = lerp(this.holdCharge, 0, 1 - Math.exp(-10 * dt));
      }

      // Orbit secondary gravity wells
      for (let i = 1; i < this.wells.length; i++) {
        const w = this.wells[i];
        const speedMult = this.mode === 'zerog' ? 0.18 : 0.72 + this.strength * 0.28;
        w.orbitAngle += w.orbitSpeed * speedMult * dt;
        const targetX = Math.cos(w.orbitAngle) * w.orbitRadius;
        const targetZ = Math.sin(w.orbitAngle) * w.orbitRadius;
        const targetY = Math.sin(w.orbitAngle * 1.5) * 32 * Math.sin(w.tiltX + 0.3);
        w.x = lerp(w.x, targetX, 1 - Math.exp(-4 * dt));
        w.y = lerp(w.y, targetY, 1 - Math.exp(-4 * dt));
        w.z = lerp(w.z, targetZ, 1 - Math.exp(-4 * dt));
      }

      // Update expanding pulse waves
      for (let i = this.pulses.length - 1; i >= 0; i--) {
        const pulse = this.pulses[i];
        pulse.age += dt;
        pulse.radius += pulse.speed * dt;
        if (pulse.radius > pulse.maxRadius) {
          this.pulses.splice(i, 1);
        }
      }

      // Audio beat pulse & ring modulation
      if (this.audioBeatCooldown > 0) {
        this.audioBeatCooldown = Math.max(0, this.audioBeatCooldown - dt);
      }
      if (this.audioData.active && this.audioData.beat > 0.52 && this.audioBeatCooldown <= 0) {
        this.triggerPulse(0, 0, 0, clamp(0.45 + this.audioData.beat * 0.72, 0.45, 1.35));
        this.audioBeatCooldown = 0.26;
      }

      // Update astro rings
      const trebleSpinBoost = this.audioData.active ? (this.audioData.treble * 1.45 + this.audioData.energy * 0.55) : 0;
      for (let i = 0; i < this.astroRings.length; i++) {
        const ring = this.astroRings[i];
        const baseMult = this.mode === 'zerog' ? 0.25 : 0.65 + this.strength * 0.35;
        const mult = baseMult + trebleSpinBoost * (0.65 + i * 0.25);
        ring.angle += ring.speed * mult * dt;
      }

      // Update 3D particles physics
      this.updateParticles(dt);

      // Update spacetime lattice curvature
      this.updateLattice();

      // Throttled UI telemetry sync
      this.telemetryTimer += dt;
      if (this.telemetryTimer >= 0.08) {
        this.telemetryTimer = 0;
        if (this.callbacks.onTelemetry) {
          this.callbacks.onTelemetry({
            yawDeg: ((this.camera.yaw * 180) / Math.PI) % 360,
            pitchDeg: (this.camera.pitch * 180) / Math.PI,
            depth: Math.round(this.camera.distance),
            bodies: this.particles.length,
            wells: this.wells.length,
            curvature: this.currentCurvature
          });
        }
      }
    }

    updateParticles(dt) {
      const audio = this.audioData;
      const bassBoost = audio.active ? audio.bass : 0;
      const midBoost = audio.active ? audio.mid : 0;
      const trebleBoost = audio.active ? audio.treble : 0;
      const G = 1800000 * this.strength * (1 + bassBoost * 0.55);
      const sign = this.effectiveModeSign;
      const cursorMass =
        this.cursorInfluence * (0.36 + this.holdCharge * 2.4) * this.strength;
      const hasCursor = cursorMass > 0.02;

      for (let i = 0; i < this.particles.length; i++) {
        const p = this.particles[i];
        p.px = p.x;
        p.py = p.y;
        p.pz = p.z;

        let ax = 0;
        let ay = 0;
        let az = 0;

        // Forces from singularity wells
        if (Math.abs(sign) > 0.01) {
          for (let wIdx = 0; wIdx < this.wells.length; wIdx++) {
            const w = this.wells[wIdx];
            const dx = w.x - p.x;
            const dy = w.y - p.y;
            const dz = w.z - p.z;
            const distSq = dx * dx + dy * dy + dz * dz + 1800;
            const dist = Math.sqrt(distSq);

            if (sign > 0 && w.isPrimary && dist < 39 && !this.isCompressing) {
              const respawn = this.createParticle(false);
              p.x = respawn.x;
              p.y = respawn.y;
              p.z = respawn.z;
              p.px = p.x;
              p.py = p.y;
              p.pz = p.z;
              p.vx = respawn.vx;
              p.vy = respawn.vy;
              p.vz = respawn.vz;
              continue;
            }

            const force = (G * w.mass * sign) / distSq;
            ax += (dx / dist) * force;
            ay += (dy / dist) * force;
            az += (dz / dist) * force;

            // Gentle Kerr frame-dragging tangential curl in attract mode
            if (sign > 0) {
              const swirl = (1650 * this.strength * (1 + midBoost * 1.15 + trebleBoost * 0.45) * w.mass * sign) / (dist + 60);
              ax += (-dz / dist) * swirl;
              az += (dx / dist) * swirl;
            }
          }
        }

        // Force from live cursor gravity lens
        if (hasCursor) {
          const cdx = this.smoothCursorWorld.x - p.x;
          const cdy = this.smoothCursorWorld.y - p.y;
          const cdz = this.smoothCursorWorld.z - p.z;
          const cDistSq = cdx * cdx + cdy * cdy + cdz * cdz + 2600;
          const cDist = Math.sqrt(cDistSq);
          const cursorSign = this.isCompressing ? 1.45 : sign === 0 ? 0.45 : sign;
          const cForce = (G * 0.55 * cursorMass * cursorSign) / cDistSq;
          ax += (cdx / cDist) * cForce;
          ay += (cdy / cDist) * cForce;
          az += (cdz / cDist) * cForce;

          if (this.isCompressing) {
            const cSwirl = (4200 * this.holdCharge * this.strength) / (cDist + 45);
            ax += (-cdz / cDist) * cSwirl;
            az += (cdx / cDist) * cSwirl;
          }
        }

        // Zero-G serene cosmic curl drift
        if (this.mode === 'zerog') {
          const driftTime = this.time * 0.6 + p.seed;
          ax += Math.sin(driftTime + p.z * 0.012) * 26;
          ay += Math.cos(driftTime * 0.8 + p.x * 0.012) * 18;
          az += Math.cos(driftTime + p.y * 0.012) * 26;
        } else {
          // Subtle accretion disk vertical restoring force keeps 3D thickness balanced
          ay += -p.y * 0.48 * Math.abs(sign);
        }

        // Acoustic harmonic cymatics wave when audio field is active
        if (audio.active) {
          const radial = Math.sqrt(p.x * p.x + p.z * p.z) + 1;
          const wavePhase = this.time * (3.2 + midBoost * 3.4) - radial * 0.016 + p.seed * 1.5;
          ay += Math.sin(wavePhase) * (midBoost * 145 + trebleBoost * 80);
          if (bassBoost > 0.02) {
            const radialPulse = Math.cos(this.time * 2.4 - radial * 0.014) * bassBoost * 95;
            ax += (p.x / radial) * radialPulse;
            az += (p.z / radial) * radialPulse;
          }
        }

        // Soft outer spherical containment shell
        const rAll = Math.hypot(p.x, p.y, p.z);
        if (rAll > 410) {
          const pullBack = (rAll - 410) * (this.mode === 'repel' ? 2.4 : 1.4);
          ax -= (p.x / rAll) * pullBack;
          ay -= (p.y / rAll) * pullBack;
          az -= (p.z / rAll) * pullBack;
        }

        // Integrate velocity with light relativistic damping
        p.vx += ax * dt;
        p.vy += ay * dt;
        p.vz += az * dt;

        const damping = this.mode === 'zerog' ? Math.exp(-0.38 * dt) : Math.exp(-0.085 * dt);
        p.vx *= damping;
        p.vy *= damping;
        p.vz *= damping;

        // Clamp extreme velocity
        const speed = Math.hypot(p.vx, p.vy, p.vz);
        if (speed > 440) {
          const ratio = 440 / speed;
          p.vx *= ratio;
          p.vy *= ratio;
          p.vz *= ratio;
        }

        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.z += p.vz * dt;
      }
    }

    updateLattice() {
      const halfW = this.width * 0.5;
      const halfH = this.height * 0.5;
      const sign = this.effectiveModeSign;
      const audio = this.audioData;
      const bass = audio.active ? audio.bass : 0;
      const mid = audio.active ? audio.mid : 0;
      const treble = audio.active ? audio.treble : 0;
      const waveAmp = audio.active ? bass * 34 + mid * 20 + treble * 10 : 0;
      const depthAmp = 76 * this.strength * (1 + bass * 0.65);
      const cursorDepth =
        this.cursorInfluence * (22 + this.holdCharge * 92) * this.strength;

      let maxCurv = 0;

      for (let iz = 0; iz <= this.latticeSize; iz++) {
        const row = this.latticeVerts[iz];
        for (let ix = 0; ix <= this.latticeSize; ix++) {
          const v = row[ix];
          if (v.radialFade <= 0.005) {
            v.visible = false;
            continue;
          }

          let dispY = Math.sin(this.time * 0.9 + v.r * 0.015) * 2.2;
          if (audio.active) {
            dispY += Math.sin(this.time * 4.2 - v.r * 0.026) * waveAmp;
            dispY += Math.cos(this.time * 2.8 + v.baseX * 0.014) * Math.sin(v.baseZ * 0.014) * (mid * 18);
          }
          let shiftX = 0;
          let shiftZ = 0;

          // Singularity wells spacetime deformation
          if (Math.abs(sign) > 0.005) {
            for (let wIdx = 0; wIdx < this.wells.length; wIdx++) {
              const w = this.wells[wIdx];
              const dx = w.x - v.baseX;
              const dz = w.z - v.baseZ;
              const d = Math.sqrt(dx * dx + dz * dz + 1500);
              const potential = (depthAmp * w.mass * 46) / d;

              dispY -= potential * sign;

              // Radial spacetime pinch toward well
              const pinch = clamp((potential * 0.16 * sign) / d, -0.24, 0.30);
              shiftX += dx * pinch;
              shiftZ += dz * pinch;
            }
          }

          // Cursor localized dimple
          if (cursorDepth > 1) {
            const cdx = this.smoothCursorWorld.x - v.baseX;
            const cdz = this.smoothCursorWorld.z - v.baseZ;
            const cd = Math.sqrt(cdx * cdx + cdz * cdz + 1850);
            const cPot = (cursorDepth * 26) / cd;
            const cSign = this.isCompressing ? 1.15 : sign === 0 ? 0.5 : sign;
            dispY -= cPot * cSign;
            const cPinch = clamp((cPot * 0.12 * cSign) / cd, -0.18, 0.24);
            shiftX += cdx * cPinch;
            shiftZ += cdz * cPinch;
          }

          // Pulse waves soliton ripples
          for (let pIdx = 0; pIdx < this.pulses.length; pIdx++) {
            const pulse = this.pulses[pIdx];
            const pd = Math.hypot(v.baseX - pulse.x, v.baseZ - pulse.z);
            const diff = pd - pulse.radius;
            const envelope = Math.exp(-(diff * diff) / 1450) * (1 - pulse.radius / pulse.maxRadius);
            dispY += Math.cos(diff * 0.085) * 26 * pulse.power * envelope;
          }

          v.x = v.baseX + shiftX;
          v.y = clamp(dispY, -175, 130) * v.radialFade;
          v.z = v.baseZ + shiftZ;
          v.curvature = Math.abs(v.y) / 130;
          if (v.curvature > maxCurv) maxCurv = v.curvature;

          const proj = this.camera.project(v.x, v.y, v.z, halfW, halfH, 1.0);
          if (proj) {
            v.px = proj.x;
            v.py = proj.y;
            v.pz = proj.z;
            v.visible = true;
          } else {
            v.visible = false;
          }
        }
      }

      this.currentCurvature = lerp(
        this.currentCurvature,
        this.mode === 'zerog' ? 0.08 + this.holdCharge * 0.8 : 0.45 + maxCurv * 1.45,
        0.16
      );
    }

    render() {
      const ctx = this.ctx;
      const w = this.width;
      const h = this.height;
      const halfW = w * 0.5;
      const halfH = h * 0.5;
      const t = this.themeT;

      // 1. Background Void / Alabaster Space Gradient
      const bgGrad = ctx.createRadialGradient(
        halfW,
        halfH * 0.92,
        20,
        halfW,
        halfH,
        Math.max(w, h) * 0.85
      );
      bgGrad.addColorStop(0, rgbaMix(THEME_PALETTES.darkBgCenter, THEME_PALETTES.lightBgCenter, t, 1));
      bgGrad.addColorStop(1, rgbaMix(THEME_PALETTES.darkBgEdge, THEME_PALETTES.lightBgEdge, t, 1));
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // 2. Deep 3D Celestial Sphere Stars
      this.renderStars(ctx, halfW, halfH, t);

      // 3. Deformable 3D Spacetime Curvature Lattice
      this.renderLattice(ctx, t);

      // 4. Cursor Gravitational Lens Reticle (subtle geometric targeting ring)
      this.renderCursorLens(ctx, halfW, halfH, t);

      // 5. Depth-Sorted 3D Objects: Singularity Cores, Gyroscopic Rings, Accretion Particles
      this.renderDepthSortedCosmos(ctx, halfW, halfH, t);
    }

    renderStars(ctx, halfW, halfH, t) {
      const rotAngle = this.time * 0.008;
      const cosR = Math.cos(rotAngle);
      const sinR = Math.sin(rotAngle);

      for (let i = 0; i < this.stars.length; i++) {
        const s = this.stars[i];
        const rx = s.x * cosR - s.z * sinR;
        const rz = s.x * sinR + s.z * cosR;
        const proj = this.camera.projectStar(rx, s.y, rz, halfW, halfH);
        if (!proj) continue;
        if (proj.x < -12 || proj.x > this.width + 12 || proj.y < -12 || proj.y > this.height + 12) {
          continue;
        }

        const trebleMod = this.audioData.active ? this.audioData.treble : 0;
        const twinkle = clamp(0.72 + 0.28 * Math.sin(this.time * s.twinkleSpeed + s.phase) + trebleMod * 0.28, 0.25, 1.3);
        const alpha = clamp(s.baseAlpha * twinkle * (t > 0.5 ? 0.58 : 0.92), 0, 1);
        const radius = clamp(s.size * proj.scale * (1.45 + trebleMod * 0.42), 0.55, 3.6);

        ctx.fillStyle = rgbaMix(THEME_PALETTES.darkInk, THEME_PALETTES.lightInk, t, alpha);
        ctx.beginPath();
        ctx.arc(proj.x, proj.y, radius, 0, Math.PI * 2);
        ctx.fill();

        if (s.glint && radius > 0.95) {
          const arm = radius * 4.2;
          ctx.strokeStyle = rgbaMix(THEME_PALETTES.darkInk, THEME_PALETTES.lightInk, t, alpha * 0.35);
          ctx.lineWidth = 0.65;
          ctx.beginPath();
          ctx.moveTo(proj.x - arm, proj.y);
          ctx.lineTo(proj.x + arm, proj.y);
          ctx.moveTo(proj.x, proj.y - arm);
          ctx.lineTo(proj.x, proj.y + arm);
          ctx.stroke();
        }
      }
    }

    renderLattice(ctx, t) {
      const n = this.latticeSize;
      ctx.lineWidth = 0.78;

      const drawSegment = (a, b) => {
        if (!a.visible || !b.visible) return;
        const fade = Math.min(a.radialFade, b.radialFade);
        if (fade <= 0.01) return;

        const avgCurv = (a.curvature + b.curvature) * 0.5;
        const depthAtten = clamp(820 / ((a.pz + b.pz) * 0.5 + 120), 0.32, 1.15);
        const baseAlpha = t > 0.5 ? 0.075 : 0.085;
        const alpha = clamp((baseAlpha + avgCurv * 0.26) * fade * depthAtten, 0, 0.42);
        if (alpha < 0.008) return;

        ctx.strokeStyle = rgbaMix(THEME_PALETTES.darkMuted, THEME_PALETTES.lightMuted, t, alpha);
        ctx.beginPath();
        ctx.moveTo(a.px, a.py);
        ctx.lineTo(b.px, b.py);
        ctx.stroke();
      };

      for (let iz = 0; iz <= n; iz++) {
        const row = this.latticeVerts[iz];
        for (let ix = 0; ix < n; ix++) {
          drawSegment(row[ix], row[ix + 1]);
        }
      }

      for (let ix = 0; ix <= n; ix++) {
        for (let iz = 0; iz < n; iz++) {
          drawSegment(this.latticeVerts[iz][ix], this.latticeVerts[iz + 1][ix]);
        }
      }
    }

    renderCursorLens(ctx, halfW, halfH, t) {
      if (this.cursorInfluence < 0.05) return;
      const proj = this.camera.project(
        this.smoothCursorWorld.x,
        this.smoothCursorWorld.y,
        this.smoothCursorWorld.z,
        halfW,
        halfH,
        1.0
      );
      if (!proj) return;

      const ringR = lerp(24, 9, this.holdCharge) * clamp(proj.scale, 0.65, 1.5);
      const alpha = this.cursorInfluence * (this.isCompressing ? 0.62 : 0.22);

      ctx.save();
      ctx.strokeStyle = rgbaMix(THEME_PALETTES.darkInk, THEME_PALETTES.lightInk, t, alpha);
      ctx.lineWidth = this.isCompressing ? 1.25 : 0.8;
      ctx.setLineDash(this.isCompressing ? [] : [3, 4]);
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, ringR, 0, Math.PI * 2);
      ctx.stroke();

      if (this.isCompressing && this.holdCharge > 0.05) {
        ctx.setLineDash([]);
        ctx.strokeStyle = rgbaMix(THEME_PALETTES.darkInk, THEME_PALETTES.lightInk, t, 0.72);
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(
          proj.x,
          proj.y,
          ringR + 7,
          -Math.PI * 0.5,
          -Math.PI * 0.5 + Math.PI * 2 * this.holdCharge
        );
        ctx.stroke();
      }
      ctx.restore();
    }

    renderDepthSortedCosmos(ctx, halfW, halfH, t) {
      const queue = this.renderQueue;
      queue.length = 0;

      // Queue expanding pulse rings on XZ plane
      for (let i = 0; i < this.pulses.length; i++) {
        const pulse = this.pulses[i];
        const segs = 54;
        for (let s = 0; s < segs; s++) {
          const a0 = (s / segs) * Math.PI * 2;
          const a1 = ((s + 1) / segs) * Math.PI * 2;
          const p0 = this.camera.project(
            pulse.x + Math.cos(a0) * pulse.radius,
            pulse.y,
            pulse.z + Math.sin(a0) * pulse.radius,
            halfW,
            halfH,
            1.0
          );
          const p1 = this.camera.project(
            pulse.x + Math.cos(a1) * pulse.radius,
            pulse.y,
            pulse.z + Math.sin(a1) * pulse.radius,
            halfW,
            halfH,
            1.0
          );
          if (!p0 || !p1) continue;
          const alpha = (1 - pulse.radius / pulse.maxRadius) * 0.45 * pulse.power;
          queue.push({
            z: (p0.z + p1.z) * 0.5,
            type: 'segment',
            x0: p0.x,
            y0: p0.y,
            x1: p1.x,
            y1: p1.y,
            alpha,
            lineWidth: 1.25
          });
        }
      }

      // Queue gyroscopic astrolabe rings around primary well
      const primary = this.wells[0];

      }
      this.prevBass = this.prevBass * 0.82 + rawBass * 0.18;

      const energy = Math.min(1.5, this.smoothBass * 0.45 + this.smoothMid * 0.35 + this.smoothTreble * 0.2);
      return {
        active: true,
        bass: this.smoothBass,
        mid: this.smoothMid,
        treble: this.smoothTreble,
        energy,
        beat: this.beatImpulse
      };
    }

    playHarmonic(freq = 330, duration = 0.22, vol = 0.06) {
      if (this.mode !== 'synth' || !this.enabled || !this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.72, now + duration);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(gain);
      gain.connect(this.analyser || this.ctx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    playPulse() {
      if (this.mode !== 'synth' || !this.enabled || !this.ctx) return;
      this.playHarmonic(196, 0.55, 0.09);
      this.playHarmonic(392, 0.42, 0.04);
    }
  }

  function formatSignedDeg(deg) {
    const sign = deg >= 0 ? '+' : '-';
    return sign + Math.abs(deg).toFixed(1).padStart(4, '0');
  }

  function formatYaw(deg) {
    const norm = ((deg % 360) + 360) % 360;
    return norm.toFixed(1).padStart(5, '0');
  }

  function spawnRipple(btn, clientX, clientY) {
    const rect = btn.getBoundingClientRect();
    const x = clientX ? clientX - rect.left : rect.width * 0.5;
    const y = clientY ? clientY - rect.top : rect.height * 0.5;

    const ripple = document.createElement('span');
    ripple.className = 'breath-ripple';
    ripple.style.left = `${x}px`;
    ripple.style.top = `${y}px`;
    btn.appendChild(ripple);

    global.setTimeout(() => {
      ripple.remove();
    }, 620);
  }

  function setupBreathingButtons() {
    const buttons = document.querySelectorAll('.breath-btn');
    buttons.forEach((btn) => {
      btn.addEventListener('pointermove', (e) => {
        const rect = btn.getBoundingClientRect();
        const relX = (e.clientX - rect.left) / rect.width;
        const relY = (e.clientY - rect.top) / rect.height;
        const mx = (relX - 0.5) * 2;
        const my = (relY - 0.5) * 2;
        btn.style.setProperty('--mx', mx.toFixed(3));
        btn.style.setProperty('--my', my.toFixed(3));
        btn.style.setProperty('--spot-x', `${(relX * 100).toFixed(1)}%`);
        btn.style.setProperty('--spot-y', `${(relY * 100).toFixed(1)}%`);
      });

      btn.addEventListener('pointerleave', () => {
        btn.style.setProperty('--mx', '0');
        btn.style.setProperty('--my', '0');
      });

      btn.addEventListener('pointerdown', (e) => {
        spawnRipple(btn, e.clientX, e.clientY);
      });
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('cosmos-canvas');
    const editorialOverlay = document.querySelector('.editorial-overlay');
    const btnTheme = document.getElementById('btn-theme');
    const themeLabel = document.getElementById('theme-label');
    const btnZen = document.getElementById('btn-zen');
    const btnZenRestore = document.getElementById('btn-zen-restore');
    const btnAudio = document.getElementById('btn-audio');
    const btnAudioLabel = document.getElementById('btn-audio-label');
    const audioPopover = document.getElementById('audio-popover');
    const audioSourceTag = document.getElementById('audio-source-tag');
    const audioSourceBtns = Array.from(document.querySelectorAll('.audio-src-btn'));
    const audioDeviceRow = document.getElementById('audio-device-row');
    const audioDeviceSelect = document.getElementById('audio-device-select');
    const audioFileRow = document.getElementById('audio-file-row');
    const audioFileInput = document.getElementById('audio-file-input');
    const btnAudioPick = document.getElementById('btn-audio-pick');
    const btnAudioPlay = document.getElementById('btn-audio-play');
    const audioPlayLabel = document.getElementById('audio-play-label');
    const audioFileName = document.getElementById('audio-file-name');
    const audioSensitivity = document.getElementById('audio-sensitivity');
    const audioSensValue = document.getElementById('audio-sens-value');
    const meterBass = document.getElementById('meter-bass');
    const meterMid = document.getElementById('meter-mid');
    const meterTreble = document.getElementById('meter-treble');
    const audioStatus = document.getElementById('audio-status');
    const btnPulse = document.getElementById('btn-pulse');
    const btnWell = document.getElementById('btn-well');
    const btnReset = document.getElementById('btn-reset');

    const modeSlider = document.getElementById('mode-slider');
    const modeButtons = Array.from(document.querySelectorAll('.mode-btn'));
    const fieldStateLabel = document.getElementById('field-state-label');

    const gravitySlider = document.getElementById('gravity-slider');
    const gravityReadout = document.getElementById('gravity-readout');

    const wellCountBadge = document.getElementById('well-count');
    const coordYaw = document.getElementById('coord-yaw');
    const coordPitch = document.getElementById('coord-pitch');
    const coordDepth = document.getElementById('coord-depth');
    const metricBodies = document.getElementById('metric-bodies');
    const metricWells = document.getElementById('metric-wells');
    const metricCurvature = document.getElementById('metric-curvature');

    const audio = new CosmicAudio();

    const engine = new global.CosmosEngine(canvas, {
      onPointerParallax(nx, ny) {
        if (editorialOverlay) {
          editorialOverlay.style.setProperty('--ui-parallax-x', `${(-nx * 6).toFixed(2)}px`);
          editorialOverlay.style.setProperty('--ui-parallax-y', `${(-ny * 4.5).toFixed(2)}px`);
        }
      },
      onWellCountChange(count) {
        wellCountBadge.textContent = `${count}/3`;
        metricWells.textContent = String(count);
      },
      onWellSpawned() {
        audio.playHarmonic(523.25, 0.24, 0.05);
      },
      onShockwave() {
        audio.playPulse();
      },
      onTelemetry(data) {
        coordYaw.textContent = formatYaw(data.yawDeg);
        coordPitch.textContent = formatSignedDeg(data.pitchDeg);
        coordDepth.textContent = String(data.depth).padStart(4, '0');
        metricBodies.textContent = String(data.bodies);
        metricWells.textContent = String(data.wells);
        metricCurvature.textContent = data.curvature.toFixed(2);
      }
    });

    function syncModeSlider() {
      const activeBtn = modeButtons.find((b) => b.classList.contains('is-active'));
      if (!activeBtn || !modeSlider) return;
      const left = activeBtn.offsetLeft;
      const width = activeBtn.offsetWidth;
      modeSlider.style.width = `${width}px`;
      modeSlider.style.transform = `translateX(${left - 3}px)`;
    }

    function applyTheme(theme) {
      const isLight = theme === 'light';
      document.documentElement.dataset.theme = theme;
      btnTheme.setAttribute('aria-pressed', String(isLight));
      themeLabel.textContent = isLight ? '观测 · 白' : '深空 · 黑';
      engine.setTheme(theme);
      try {
        localStorage.setItem('gravitas-theme', theme);
      } catch (err) {
        // Ignore storage errors in restricted contexts
      }
    }

    function applyMode(mode) {
      const labels = {
        attract: 'ATTRACT',
        repel: 'REPEL',
        zerog: 'ZERO-G'
      };
      modeButtons.forEach((b) => {
        const active = b.dataset.mode === mode;
        b.classList.toggle('is-active', active);
        b.setAttribute('aria-checked', String(active));
      });
      fieldStateLabel.textContent = labels[mode] || 'ATTRACT';
      syncModeSlider();
      engine.setMode(mode);
      audio.playHarmonic(mode === 'attract' ? 293.66 : mode === 'repel' ? 392.0 : 220.0, 0.2, 0.05);
    }

    function setZenMode(enabled) {
      document.body.classList.toggle('is-zen', enabled);
      btnZen.setAttribute('aria-pressed', String(enabled));
      btnZenRestore.hidden = !enabled;
    }

    // Initialize saved theme or default dark
    let initialTheme = 'dark';
    try {
      const saved = localStorage.getItem('gravitas-theme');
      if (saved === 'light' || saved === 'dark') {
        initialTheme = saved;
      }
    } catch (err) {
      initialTheme = 'dark';
    }
    applyTheme(initialTheme);
    engine.themeT = initialTheme === 'light' ? 1 : 0;

    setupBreathingButtons();
    syncModeSlider();
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(syncModeSlider);
    }
    window.addEventListener('resize', syncModeSlider);

    // Event bindings
    btnTheme.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      applyTheme(next);
      audio.playHarmonic(next === 'light' ? 587.33 : 293.66, 0.25, 0.05);
    });

    const AUDIO_SOURCE_META = {
      off: { tag: 'OFF', btnLabel: '声场' },
      synth: { tag: 'SYNTH', btnLabel: '声场 · 共振' },
      system: { tag: 'SYSTEM', btnLabel: '声场 · 电脑' },
      mic: { tag: 'MIC IN', btnLabel: '声场 · 外部' },
      file: { tag: 'LOCAL', btnLabel: '声场 · 音轨' }
    };

    function setAudioPopoverOpen(open) {
      if (!audioPopover) return;
      audioPopover.hidden = !open;
      btnAudio.setAttribute('aria-expanded', String(open));
    }

    function syncAudioUI(statusMessage) {
      const mode = audio.mode;
      const active = mode !== 'off';
      const meta = AUDIO_SOURCE_META[mode] || AUDIO_SOURCE_META.off;

      btnAudio.setAttribute('aria-pressed', String(active));
      document.body.classList.toggle('audio-active', active);
      if (btnAudioLabel) btnAudioLabel.textContent = meta.btnLabel;
      if (audioSourceTag) audioSourceTag.textContent = meta.tag;

      audioSourceBtns.forEach((btn) => {
        const selected = btn.dataset.source === mode;
        btn.classList.toggle('is-selected', selected);
        btn.setAttribute('aria-checked', String(selected));
      });

      if (audioDeviceRow) {
        audioDeviceRow.hidden = mode !== 'mic' || audioDeviceSelect.options.length === 0;
      }
      if (audioFileRow) {
        audioFileRow.hidden = mode !== 'file' && !audio.fileObjectUrl;
      }
      if (audioPlayLabel) {
        audioPlayLabel.textContent = audio.isFilePlaying() ? '暂停' : '播放';
      }
      if (statusMessage && audioStatus) {
        audioStatus.textContent = statusMessage;
      }
    }

    function populateAudioDevices(devices, activeDeviceId) {
      if (!audioDeviceSelect) return;
      audioDeviceSelect.innerHTML = '';
      devices.forEach((dev, idx) => {
        const opt = document.createElement('option');
        opt.value = dev.deviceId;
        opt.textContent = dev.label || `外部音频输入 ${idx + 1}`;
        if (activeDeviceId && dev.deviceId === activeDeviceId) {
          opt.selected = true;
        }
        audioDeviceSelect.appendChild(opt);
      });
    }

    async function selectAudioSource(sourceMode) {
      if (sourceMode === 'off') {
        audio.stopAllSources();
        syncAudioUI('声场已关闭。随时可分开选择内生共振、电脑声音、外部麦克风或本地音频。');
        return;
      }

      if (sourceMode === 'synth') {
        const res = await audio.startSynth();
        syncAudioUI(res.message);
        return;
      }

      if (sourceMode === 'system') {
        const res = await audio.startSystemAudio();
        syncAudioUI(res.message);
        return;
      }

      if (sourceMode === 'mic') {
        const preferred = audioDeviceSelect ? audioDeviceSelect.value : '';
        const res = await audio.startMicAudio(preferred);
        if (res.ok && res.devices) {
          populateAudioDevices(res.devices, res.activeDeviceId);
        }
        syncAudioUI(res.message);
        return;
      }

      if (sourceMode === 'file') {
        if (!audio.fileObjectUrl) {
          if (audioFileRow) audioFileRow.hidden = false;
          syncAudioUI('请选择一段本地音频驱动空间声场。');
          if (audioFileInput) audioFileInput.click();
          return;
        }
        const res = await audio.activateLoadedFile();
        if (btnAudioPlay) btnAudioPlay.disabled = !audio.fileObjectUrl;
        syncAudioUI(res.message);
      }
    }

    audio.onExternalStop = (msg) => {
      syncAudioUI(msg);
    };

    // Audio reactivity loop feeding engine and spectrum HUD bars
    (function tickAudioField() {
      const analysis = audio.getAnalysis();
      engine.setAudioData(analysis);

      if (analysis.active) {
        const toPct = (v) => `${Math.min(100, Math.round(v * 100))}%`;
        if (meterBass) meterBass.style.width = toPct(analysis.bass);
        if (meterMid) meterMid.style.width = toPct(analysis.mid);
        if (meterTreble) meterTreble.style.width = toPct(analysis.treble);
        document.body.style.setProperty('--audio-energy', analysis.energy.toFixed(3));
      } else {
        if (meterBass && meterBass.style.width !== '0%') meterBass.style.width = '0%';
        if (meterMid && meterMid.style.width !== '0%') meterMid.style.width = '0%';
        if (meterTreble && meterTreble.style.width !== '0%') meterTreble.style.width = '0%';
        document.body.style.setProperty('--audio-energy', '0');
      }

      requestAnimationFrame(tickAudioField);
    })();

    btnAudio.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = audioPopover ? !audioPopover.hidden : false;
      setAudioPopoverOpen(!isOpen);
    });

    if (audioPopover) {
      audioPopover.addEventListener('click', (e) => e.stopPropagation());
    }

    document.addEventListener('click', (e) => {
      if (!audioPopover || audioPopover.hidden) return;
      if (!audioPopover.contains(e.target) && !btnAudio.contains(e.target)) {
        setAudioPopoverOpen(false);
      }
    });

    audioSourceBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        selectAudioSource(btn.dataset.source);
      });
    });

    if (audioDeviceSelect) {
      audioDeviceSelect.addEventListener('change', async (e) => {
        if (audio.mode === 'mic') {
          const res = await audio.startMicAudio(e.target.value);
          syncAudioUI(res.message);
        }
      });
    }

    if (btnAudioPick && audioFileInput) {
      btnAudioPick.addEventListener('click', () => {
        audioFileInput.click();
      });
      audioFileInput.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const res = await audio.loadAudioFile(file);
        if (audioFileName) audioFileName.textContent = file.name;
        if (btnAudioPlay) btnAudioPlay.disabled = false;
        syncAudioUI(res.message);
      });
    }

    if (btnAudioPlay) {
      btnAudioPlay.addEventListener('click', async () => {
        await audio.toggleFilePlayback();
        syncAudioUI(
          audio.isFilePlaying()
            ? `正在播放本地音轨：${audio.fileName}`
            : `已暂停：${audio.fileName}`
        );
      });
    }

    if (audioSensitivity) {
      audioSensitivity.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        audio.setSensitivity(val);
        if (audioSensValue) audioSensValue.textContent = `${val.toFixed(1)}x`;
      });
    }

    btnZen.addEventListener('click', () => setZenMode(true));
    btnZenRestore.addEventListener('click', () => setZenMode(false));

    modeButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        applyMode(btn.dataset.mode);
      });
    });

    gravitySlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      gravityReadout.textContent = `${val.toFixed(1)}G`;
      engine.setStrength(val);
    });

    btnPulse.addEventListener('click', () => {
      engine.triggerPulse(0, 0, 0, 1.0);
      audio.playPulse();
    });

    btnWell.addEventListener('click', () => {
      engine.addWell();
      audio.playHarmonic(523.25, 0.24, 0.05);
    });

    btnReset.addEventListener('click', () => {
      engine.reset();
      gravitySlider.value = '1.0';
      gravityReadout.textContent = '1.0G';
      engine.setStrength(1.0);
      applyMode('attract');
      audio.playHarmonic(329.63, 0.26, 0.05);
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
        return;
      }
      const key = e.key.toLowerCase();
      if (key === 't') {
        btnTheme.click();
      } else if (key === 'h') {
        setZenMode(!document.body.classList.contains('is-zen'));
      } else if (e.key === 'Escape' && audioPopover && !audioPopover.hidden) {
        setAudioPopoverOpen(false);
      } else if (e.key === 'Escape' && document.body.classList.contains('is-zen')) {
        setZenMode(false);
      } else if (key === 'r') {
        btnReset.click();
      } else if (key === 'm') {
        if (audio.mode === 'off') {
          selectAudioSource(audio.lastActiveMode || 'synth');
        } else {
          selectAudioSource('off');
        }
      } else if (key === '1') {
        applyMode('attract');
      } else if (key === '2') {
        applyMode('repel');
      } else if (key === '3') {
        applyMode('zerog');
      } else if (e.code === 'Space' && document.activeElement === document.body) {
        e.preventDefault();
        spawnRipple(btnPulse);
        engine.triggerPulse(0, 0, 0, 1.0);
        audio.playPulse();
      }
    });

    engine.start();
  });
})(window);

  </script>
</body>
</html>
